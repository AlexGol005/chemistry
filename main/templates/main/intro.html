<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Химия для всех</title>
    <style>
        /* Обнуление стилей и центрирование контента на весь экран */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Железобетонный линейный градиент сверху вниз — поймет любой браузер */
            background: linear-gradient(180deg, #F4FDFD 0%, #D4F4F2 100%);
            
            overflow: hidden;
            position: relative;
        }

        /* Абсолютно позиционированные фоновые химические иконки прямо в коде */
        .bg-icon {
            position: absolute;
            fill: none;
            stroke: #0ABAB5;
            stroke-width: 1.5;
            stroke-opacity: 0.15; /* Легкие и ненавязчивые */
            z-index: 1;
            pointer-events: none;
        }

        /* Раскидываем картинки по разным углам экрана */
        .icon-1 { top: 10%; left: 10%; width: 120px; height: 120px; }
        .icon-2 { top: 15%; right: 12%; width: 100px; height: 100px; }
        .icon-3 { bottom: 12%; left: 15%; width: 90px; height: 90px; }
        .icon-4 { bottom: 10%; right: 10%; width: 130px; height: 130px; }
        .icon-5 { top: 45%; left: 5%; width: 70px; height: 70px; }
        .icon-6 { top: 50%; right: 6%; width: 80px; height: 80px; }

        /* Контейнер: увеличенное расстояние между кнопками */
        .welcome-container {
            position: relative;
            z-index: 2; /* Кнопки находятся выше картинок */
            display: flex;
            flex-direction: row;
            gap: 60px; 
            padding: 30px;
            max-width: 960px;
            width: 100%;
            justify-content: center;
        }

        /* Общий стиль для интерактивных кнопок-ссылок */
        .chem-link {
            flex: 1;
            min-height: 200px;
            max-width: 380px;
            padding: 30px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(10, 186, 181, 0.1);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        /* Левая кнопка: "Я химик" — солидная, белая, с акцентом */
        .btn-pro {
            background: #ffffff;
            color: #098481;
            border: 2px solid #ffffff;
        }

        .btn-pro:hover {
            background: #065755;
            color: #ffffff;
            border-color: #065755;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(6, 87, 85, 0.2);
        }

        /* Правая кнопка: "Я хочу быть химиком" — полупрозрачная */
        .btn-student {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #087370;
            border: 2px solid rgba(10, 186, 181, 0.25);
        }

        .btn-student:hover {
            background: #0ABAB5;
            color: #ffffff;
            border-color: #0ABAB5;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(10, 186, 181, 0.25);
        }

        /* Эффект клика */
        .chem-link:active {
            transform: translateY(-2px) scale(0.99);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 768px) {
            .welcome-container {
                flex-direction: column;
                align-items: center;
                gap: 30px; 
                padding: 20px;
            }
            .chem-link {
                width: 100%;
                min-height: 140px;
                font-size: 21px;
            }
            /* На мобильных скрываем часть картинок, чтобы не перегружать экран */
            .icon-5, .icon-6 { display: none; }
        }
    </style>
</head>
<body>

    <!-- Фоновые картинки (Колбы, молекулы, атомы) вставлены прямо в тело страницы -->
    <!-- 1. Лабораторная колба Эрленмейера -->
    <svg class="bg-icon icon-1" viewBox="0 0 24 24"><path d="M18 19l-4-8V5h1V3H9v2h1v6l-4 8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2zM10 5h4v6l3.5 7H6.5L10 11z"/></svg>
    
    <!-- 2. Молекула / Атомная структура -->
    <svg class="bg-icon icon-2" viewBox="0 0 24 24"><circle cx='12' cy='12' r='3'/><circle cx='12' cy='4' r='2'/><circle cx='4' cy='16' r='2'/><circle cx='20' cy='16' r='2'/><path d='M12 6v3M5.5 15l2.5-2M18.5 15l-2.5-2'/></svg>
    
    <!-- 3. Химический стакан с делениями -->
    <svg class="bg-icon icon-3" viewBox="0 0 24 24"><path d="M19 3H5v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3zm-2 16H7V5h10v14zM9 7h3v2H9V7zm0 4h5v2H9v-2z"/></svg>
    
    <!-- 4. Круглая мерная колба -->
    <svg class="bg-icon icon-4" viewBox="0 0 24 24"><path d="M16 13.22V5h1V3H7v2h1v8.22a7 7 0 1 0 8 0zM12 21a5 5 0 0 1-4-8V5h8v8a5 5 0 0 1-4 8z"/></svg>

    <!-- 5. Маленькая связь молекул -->
    <svg class="bg-icon icon-5" viewBox="0 0 24 24"><circle cx='6' cy='6' r='2'/><circle cx='18' cy='18' r='2'/><path d='M7.5 7.5l9 9'/></svg>

    <!-- 6. Пробирка -->
    <svg class="bg-icon icon-6" viewBox="0 0 24 24"><path d="M16 3H8v2h1v11a3 3 0 0 0 6 0V5h1V3zm-3 13a1 1 0 0 1-2 0V5h2v11z"/></svg>

    <div class="welcome-container">
        <!-- Кнопка "Я химик" ведет на /lab/ -->
        <a href="/lab/" class="chem-link btn-pro">Я химик</a>
        
        <!-- Кнопка "Я хочу быть химиком" ведет на /chem/ -->
        <a href="/chem/" class="chem-link btn-student">Я хочу быть химиком</a>
    </div>

</body>
</html>
