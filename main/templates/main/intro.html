<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Химическая заставка</title>
    <style>
        /* Обнуление стилей и центрирование контента на весь экран */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Приятный светлый фон */
            background-color: #EBF8F7; 
            /* Ненавязчивый химический узор: атомы, связи и молекулярная сетка */
            background-image: 
                radial-gradient(rgba(10, 186, 181, 0.08) 15%, transparent 16%),
                radial-gradient(rgba(10, 186, 181, 0.05) 15%, transparent 16%),
                linear-gradient(rgba(10, 186, 181, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 186, 181, 0.03) 1px, transparent 1px);
            background-size: 60px 60px, 30px 30px, 30px 30px, 30px 30px;
            background-position: 0 0, 15px 15px, 0 0, 0 0;
            overflow: hidden;
            position: relative;
        }

        /* Дополнительный слой для эффекта глубины и мягких теней */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.5) 30%, rgba(235,248,247,0.2) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Контейнер: увеличено расстояние между кнопками (gap: 60px) */
        .welcome-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: row;
            gap: 60px; 
            padding: 30px;
            max-width: 960px;
            width: 100%;
            justify-content: center;
        }

        /* Общий стиль для интерактивных кнопок-ссылок */
        .chem-link {
            flex: 1;
            min-height: 200px;
            max-width: 380px;
            padding: 30px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 12px 30px rgba(10, 186, 181, 0.12);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        /* Левая кнопка: "Я химик" — солидная, белая, с акцентом */
        .btn-pro {
            background: #ffffff;
            color: #098481;
            border: 2px solid #ffffff;
        }

        .btn-pro:hover {
            background: #065755;
            color: #ffffff;
            border-color: #065755;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(6, 87, 85, 0.25);
        }

        /* Правая кнопка: "Я хочу быть химиком" — полупрозрачная */
        .btn-student {
            background: rgba(10, 186, 181, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #087370;
            border: 2px solid rgba(10, 186, 181, 0.3);
        }

        .btn-student:hover {
            background: #0ABAB5;
            color: #ffffff;
            border-color: #0ABAB5;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(10, 186, 181, 0.3);
        }

        /* Эффект клика */
        .chem-link:active {
            transform: translateY(-2px) scale(0.99);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 768px) {
            .welcome-container {
                flex-direction: column;
                align-items: center;
                gap: 30px; /* Кнопки на мобильном стоят дальше друг от друга, не слипаются */
                padding: 20px;
            }
            .chem-link {
                width: 100%;
                min-height: 140px;
                font-size: 21px;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <!-- Кнопка "Я химик" ведет на /lab/ -->
        <a href="/lab/" class="chem-link btn-pro">Я химик</a>
        
        <!-- Кнопка "Я хочу быть химиком" ведет на /chem/ -->
        <a href="/chem/" class="chem-link btn-student">Я хочу быть химиком</a>
    </div>

</body>
</html>
