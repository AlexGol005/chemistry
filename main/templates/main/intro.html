<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Химическая заставка</title>
    <style>
        /* Обнуление стилей и центрирование контента на весь экран */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Осветленный, мягкий цвет Тиффани */
            background-color: #E2F6F5; 
            /* Ненавязчивые, воздушные химические картинки на фоне (колбы, атомы, формулы) */
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='120' height='120' viewBox='0 0 120 120'%3E%3Cg fill='none' stroke='%230ABAB5' stroke-width='1' stroke-opacity='0.12'%3E%3Cpath d='M15 15h10v5L17 32h-4zM20 20v5'/%3E%3Ccircle cx='50' cy='25' r='6'/%3E%3Ccircle cx='62' cy='20' r='3'/%3E%3Ccircle cx='40' cy='35' r='4'/%3E%3Cpath d='M50 25l12-5M50 25l-10 10'/%3E%3Cpath d='M95 10l5 10h-10z'/%3E%3Cpath d='M15 90l10 15h-20zm5 5h10v5'/%3E%3Cpath d='M55 70l10 20h-20zM60 70v5'/%3E%3Cpath d='M90 90h15v5l-12 12h-3z'/%3E%3Ccircle cx='20' cy='60' r='3'/%3E%3Ccircle cx='105' cy='50' r='5'/%3E%3C/g%3E%3C/svg%3E");
            overflow: hidden;
            position: relative;
        }

        /* Мягкое виньетирование для дополнительной воздушности фона */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 20%, rgba(226,246,245,0.2) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Контейнер: увеличено расстояние между кнопками (gap: 60px) */
        .welcome-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: row;
            gap: 60px; 
            padding: 30px;
            max-width: 960px;
            width: 100%;
            justify-content: center;
        }

        /* Общий стиль для интерактивных кнопок-ссылок */
        .chem-link {
            flex: 1;
            min-height: 200px;
            max-width: 380px;
            padding: 30px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 12px 30px rgba(10, 186, 181, 0.12);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        /* Левая кнопка: "Я химик" — солидная, белая, с акцентом */
        .btn-pro {
            background: #ffffff;
            color: #098481;
            border: 2px solid #ffffff;
        }

        .btn-pro:hover {
            background: #065755;
            color: #ffffff;
            border-color: #065755;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(6, 87, 85, 0.25);
        }

        /* Правая кнопка: "Я хочу быть химиком" — полупрозрачная, темнее фона для контраста */
        .btn-student {
            background: rgba(10, 186, 181, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #087370;
            border: 2px solid rgba(10, 186, 181, 0.4);
        }

        .btn-student:hover {
            background: #0ABAB5;
            color: #ffffff;
            border-color: #0ABAB5;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(10, 186, 181, 0.3);
        }

        /* Эффект клика */
        .chem-link:active {
            transform: translateY(-2px) scale(0.99);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 768px) {
            .welcome-container {
                flex-direction: column;
                align-items: center;
                gap: 30px; /* Оптимальный отступ на мобильных, чтобы кнопки не слипались */
                padding: 20px;
            }
            .chem-link {
                width: 100%;
                min-height: 140px;
                font-size: 21px;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <!-- Кнопка "Я химик" теперь ведет строго на /lab/ -->
        <a href="/lab/" class="chem-link btn-pro">Я химик</a>
        
        <!-- Кнопка "Я хочу быть химиком" ведет на /chem/ -->
        <a href="/chem/" class="chem-link btn-student">Я хочу быть химиком</a>
    </div>

</body>
</html>
