<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Химия для всех</title>
    <style>
        /* Обнуление стилей и центрирование контента на весь экран */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Слой 1: Красивый светлый градиент */
            background-color: #EBF8F7;
            
            /* Слой 2: Тонкие, изящные химические картинки (колбы, атомы, структуры) поверх градиента */
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='100' height='100' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%230ABAB5' stroke-width='1.2' stroke-opacity='0.15'%3E%3Cpath d='M10 20h8v4l-6 10h-6zm4 4v4'/%3E%3Ccircle cx='50' cy='30' r='5'/%3E%3Ccircle cx='62' cy='22' r='3'/%3E%3Ccircle cx='38' cy='38' r='3'/%3E%3Cpath d='M50 30l12-8M50 30l-12 8'/%3E%3Cpath d='M85 15l6 12h-12z'/%3E%3Ccircle cx='20' cy='75' r='4'/%3E%3Ccircle cx='32' cy='70' r='2'/%3E%3Cpath d='M20 75l12-5'/%3E%3Cpath d='M65 70l6 12h-12zm3 5h6v4'/%3E%3C/g%3E%3C/svg%3E"), 
                             radial-gradient(circle at center, #F4FDFD 0%, #D4F4F2 100%);
            
            overflow: hidden;
            position: relative;
        }

        /* Контейнер: увеличенное расстояние между кнопками */
        .welcome-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: row;
            gap: 60px; 
            padding: 30px;
            max-width: 960px;
            width: 100%;
            justify-content: center;
        }

        /* Общий стиль для интерактивных кнопок-ссылок */
        .chem-link {
            flex: 1;
            min-height: 200px;
            max-width: 380px;
            padding: 30px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Мягкая тень для эффекта парения */
            box-shadow: 0 15px 35px rgba(10, 186, 181, 0.1);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        /* Левая кнопка: "Я химик" — солидная, белая, с акцентом */
        .btn-pro {
            background: #ffffff;
            color: #098481;
            border: 2px solid #ffffff;
        }

        .btn-pro:hover {
            background: #065755;
            color: #ffffff;
            border-color: #065755;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(6, 87, 85, 0.2);
        }

        /* Правая кнопка: "Я хочу быть химиком" — полупрозрачная */
        .btn-student {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #087370;
            border: 2px solid rgba(10, 186, 181, 0.25);
        }

        .btn-student:hover {
            background: #0ABAB5;
            color: #ffffff;
            border-color: #0ABAB5;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(10, 186, 181, 0.25);
        }

        /* Эффект клика */
        .chem-link:active {
            transform: translateY(-2px) scale(0.99);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 768px) {
            .welcome-container {
                flex-direction: column;
                align-items: center;
                gap: 30px; 
                padding: 20px;
            }
            .chem-link {
                width: 100%;
                min-height: 140px;
                font-size: 21px;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <!-- Кнопка "Я химик" ведет на /lab/ -->
        <a href="/lab/" class="chem-link btn-pro">Я химик</a>
        
        <!-- Кнопка "Я хочу быть химиком" ведет на /chem/ -->
        <a href="/chem/" class="chem-link btn-student">Я хочу быть химиком</a>
    </div>

</body>
</html>
