{% load static %}

<!-- 1. Уменьшили размер контейнера до 450x300 (золотая середина для админки) -->
<div id="jsme_canvas_{{ widget.attrs.id }}" 
     style="width: 450px !important; height: 300px !important; border: 1px solid #ccc; background: white !important; display: block !important; overflow: hidden;">
</div>

<div style="margin-top: 5px; width: 450px;">
    <label style="font-weight: bold; font-size: 11px; color: #888;">SMILES:</label><br>
    <input type="text" 
           name="{{ widget.name }}" 
           id="{{ widget.attrs.id }}" 
           value="{{ widget.value|default:'' }}" 
           style="width: 100% !important; display: block !important; background: #eee !important; font-family: monospace; font-size: 11px; padding: 3px; border: 1px solid #ddd; box-sizing: border-box;" 
           readonly>
</div>

<script type="text/javascript" src="/static/jsme/jsme.nocache.js"></script>

<script type="text/javascript">
    var mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }};

    function startJSME() {
        var inputId = "{{ widget.attrs.id }}";
        var field = document.getElementById(inputId);
        var containerId = "jsme_canvas_" + inputId;

        if (!field) return;

        // 2. Уменьшили размеры в конструкторе и добавили 'autocenter'
        mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }} = new JSApplet.JSME(containerId, "450px", "300px", {
            "options": "oldLook,paste,autocenter" // 'autocenter' фиксирует положение молекулы
        });

        if (field.value) {
            mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}.readGenericMolecularInput(field.value);
        }

        mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}.setCallBack("AfterStructureModified", function(event) {
            try {
                var smiles = event.src.smiles(); // Используем event.src для надежности
                field.value = smiles;
            } catch (e) {
                console.error("Ошибка SMILES: " + e);
            }
        });

        // 3. Убрали агрессивный repaint (он может дергать картинку)
        // Оставили только проверку видимости поля
        setInterval(function() {
            if (field.type === 'hidden') {
                field.type = 'text';
                field.style.display = 'block';
            }
        }, 1000);
    }

    window.jsmeOnLoad = startJSME;

    setTimeout(function() {
        if (typeof JSApplet !== 'undefined' && !mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}) {
            startJSME();
        }
    }, 1500);
</script>
