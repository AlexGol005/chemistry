{% load static %}
<!-- Контейнер для рисования -->
<div id="jsme_container_{{ widget.attrs.id }}" style="width: 700px; height: 450px; border: 2px solid #444; margin-bottom: 10px; background-color: #fff;"></div>

<p><b>SMILES код (автозаполнение):</b></p>
<!-- Текстовое поле ДОЛЖНО быть здесь. Мы убрали 'hidden', чтобы вы его видели -->
<input type="text" 
       name="{{ widget.name }}" 
       id="{{ widget.attrs.id }}" 
       value="{{ widget.value|default:'' }}" 
       style="width: 700px; padding: 8px; border: 1px solid #ccc; background: #eee; font-family: monospace;" 
       readonly>

<script type="text/javascript" src="/static/jsme/jsme.nocache.js"></script>

<script type="text/javascript">
    function jsmeOnLoad() {
        var inputId = "{{ widget.attrs.id }}";
        var inputField = document.getElementById(inputId);

        // Проверка: видит ли скрипт текстовое поле
        if (!inputField) {
            alert("Критическая ошибка: Поле с ID " + inputId + " не найдено в HTML!");
            return;
        }

        var jsmeApplet = new JSApplet.JSME("jsme_container_" + inputId, "700px", "450px", {
            "options": "oldLook,paste"
        });

        // Загрузка существующей молекулы
        if (inputField.value) {
            jsmeApplet.readGenericMolecularInput(inputField.value);
        }

        // Передача данных из редактора в поле при каждом клике
        jsmeApplet.setCallBack("AfterStructureModified", function(jsme) {
            var smiles = jsme.smiles();
            inputField.value = smiles;
            console.log("SMILES обновлен: " + smiles);
        });

        setTimeout(function() {
            jsmeApplet.repaint();
        }, 300);
    }
</script>
