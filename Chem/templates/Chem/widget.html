{% load static %}

<!-- Уникальный контейнер для редактора -->
<div id="jsme_canvas_{{ widget.attrs.id }}" 
     style="width: 750px !important; height: 450px !important; border: 2px solid #444; background: white !important; display: block !important;">
</div>

<div style="margin-top: 15px; border: 1px solid #ddd; padding: 10px; background: #fafafa; width: 730px;">
    <label style="font-weight: bold; color: #333;">SMILES (генерируется редактором):</label><br>
    <!-- Поле с принудительными стилями 'important' -->
    <input type="text" 
           name="{{ widget.name }}" 
           id="{{ widget.attrs.id }}" 
           value="{{ widget.value|default:'' }}" 
           style="width: 100% !important; display: block !important; visibility: visible !important; opacity: 1 !important; background: #fff !important; font-family: monospace !important; color: black !important; padding: 5px !important;" 
           readonly>
</div>

<script type="text/javascript" src="/static/jsme/jsme.nocache.js"></script>

<script type="text/javascript">
    function startJSME() {
        var inputId = "{{ widget.attrs.id }}";
        var field = document.getElementById(inputId);
        var containerId = "jsme_canvas_" + inputId;

        if (!field) return;

        // Создаем редактор
        var applet = new JSApplet.JSME(containerId, "750px", "450px", {
            "options": "oldLook,paste"
        });

        // Загружаем данные
        if (field.value) {
            applet.readGenericMolecularInput(field.value);
        }

        // Связываем изменения
        applet.setCallBack("AfterStructureModified", function(jsme) {
            field.value = jsme.smiles();
            console.log("New SMILES: " + field.value);
        });

        // ЦИКЛ ПРОВЕРКИ ВИДИМОСТИ (защита от скрытия админкой)
        setInterval(function() {
            if (field.style.display === 'none' || field.type === 'hidden') {
                field.style.setProperty('display', 'block', 'important');
                field.style.setProperty('visibility', 'visible', 'important');
                field.type = 'text'; // На случай, если Django сменил тип на hidden
            }
            applet.repaint();
        }, 500);
    }

    // Регистрация функции в глобальном окне для JSME
    window.jsmeOnLoad = startJSME;

    // Резервный запуск, если jsmeOnLoad уже проскочил
    setTimeout(function() {
        if (typeof JSApplet !== 'undefined' && document.getElementById("jsme_canvas_{{ widget.attrs.id }}").innerHTML === "") {
            startJSME();
        }
    }, 1500);
</script>
