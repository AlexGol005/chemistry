{% load static %}

<!-- Контейнер для редактора -->
<div id="jsme_container_{{ widget.attrs.id }}" style="width: 700px !important; height: 450px !important; border: 2px solid #444; background-color: #fff; display: block !important;"></div>

<div style="margin-top: 10px;">
    <label>SMILES код:</label><br>
    <!-- Поле ввода с принудительным отображением -->
    <input type="text" 
           name="{{ widget.name }}" 
           id="{{ widget.attrs.id }}" 
           value="{{ widget.value|default:'' }}" 
           style="width: 700px !important; display: block !important; visibility: visible !important; padding: 8px; border: 1px solid #ccc; background: #f0f0f0; font-family: monospace;" 
           readonly>
</div>

<!-- Подключаем JSME только один раз -->
<script type="text/javascript" src="/static/jsme/jsme.nocache.js"></script>

<script type="text/javascript">
    // Используем задержку, чтобы дождаться окончания работы всех скриптов админки
    function initializeJSME() {
        var inputId = "{{ widget.attrs.id }}";
        var inputField = document.getElementById(inputId);
        var containerId = "jsme_container_" + inputId;

        if (!inputField) {
            console.error("Поле " + inputId + " не найдено, пробуем еще раз...");
            return;
        }

        // Создаем объект редактора
        var jsmeApplet = new JSApplet.JSME(containerId, "700px", "450px", {
            "options": "oldLook,paste"
        });

        // Загружаем данные из поля в редактор
        if (inputField.value) {
            jsmeApplet.readGenericMolecularInput(inputField.value);
        }

        // Связываем редактор с полем
        jsmeApplet.setCallBack("AfterStructureModified", function(jsme) {
            var smiles = jsme.smiles();
            inputField.value = smiles;
            console.log("Обновлено: " + smiles);
        });

        // Принудительная отрисовка
        setTimeout(function() { 
            jsmeApplet.repaint(); 
            // Еще раз проверяем видимость поля
            inputField.style.display = 'block';
            inputField.style.visibility = 'visible';
        }, 500);
    }

    // Запускаем инициализацию, когда всё остальное уже загрузилось
    if (typeof jsmeOnLoad === 'undefined') {
        window.jsmeOnLoad = initializeJSME;
    } else {
        // Если функция уже была вызвана раньше, запускаем вручную
        setTimeout(initializeJSME, 1000);
    }
</script>
