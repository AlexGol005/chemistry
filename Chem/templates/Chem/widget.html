{% load static %}

<!-- Контейнер редактора с фиксированным размером, который влезет в админку -->
<div id="jsme_canvas_{{ widget.attrs.id }}" 
     style="width: 600px !important; height: 400px !important; border: 2px solid #444; background: white !important; display: block !important; overflow: hidden;">
</div>

<div style="margin-top: 10px; width: 600px;">
    <label style="font-weight: bold; font-size: 12px; color: #666;">SMILES (генерируется автоматически):</label><br>
    <!-- Поле ввода, которое точно влезет по ширине -->
    <input type="text" 
           name="{{ widget.name }}" 
           id="{{ widget.attrs.id }}" 
           value="{{ widget.value|default:'' }}" 
           style="width: 100% !important; display: block !important; visibility: visible !important; background: #f9f9f9 !important; font-family: monospace !important; color: #333 !important; padding: 5px !important; border: 1px solid #ccc !important; box-sizing: border-box;" 
           readonly>
</div>

<!-- Подключение скрипта JSME -->
<script type="text/javascript" src="/static/jsme/jsme.nocache.js"></script>

<script type="text/javascript">
    var mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}; // Уникальная переменная для редактора

    function startJSME() {
        var inputId = "{{ widget.attrs.id }}";
        var field = document.getElementById(inputId);
        var containerId = "jsme_canvas_" + inputId;

        if (!field) return;

        // Инициализация (600x400 - оптимальный размер для админки)
        mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }} = new JSApplet.JSME(containerId, "600px", "400px", {
            "options": "oldLook,paste"
        });

        // Загружаем данные из базы, если они есть
        if (field.value) {
            mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}.readGenericMolecularInput(field.value);
        }

        // ИСПРАВЛЕННЫЙ CALLBACK: используем переменную объекта напрямую
        mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}.setCallBack("AfterStructureModified", function(event) {
            try {
                var smiles = mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}.smiles(); 
                field.value = smiles;
                console.log("SMILES updated: " + smiles);
            } catch (e) {
                console.error("Ошибка получения SMILES: " + e);
            }
        });

        // Защита от скрытия и принудительная отрисовка
        setInterval(function() {
            if (field.style.display === 'none' || field.type === 'hidden') {
                field.style.setProperty('display', 'block', 'important');
                field.style.setProperty('visibility', 'visible', 'important');
                field.type = 'text';
            }
            if (mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}) {
                mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}.repaint();
            }
        }, 800);
    }

    // Регистрация в глобальном окне
    window.jsmeOnLoad = startJSME;

    // Резервный запуск через 2 секунды, если автоматика не сработала
    setTimeout(function() {
        if (typeof JSApplet !== 'undefined' && !mainJsmeApplet_{{ widget.attrs.id|cut:"id_" }}) {
            startJSME();
        }
    }, 2000);
</script>
