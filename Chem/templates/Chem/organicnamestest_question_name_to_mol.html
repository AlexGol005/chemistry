{% extends 'main/base.html' %} 
{% load static %} 

{% block content %} 
<!-- Стили для адаптивности редактора -->
<style>
    .jsme-responsive-container {
        max-width: 500px;
        height: 350px;
        margin: 0 auto;
        overflow: visible;
        position: relative;
    }
    @media (max-width: 540px) {
        #jsme_canvas_test {
            transform: scale(0.85);
            transform-origin: top center;
        }
        .jsme-responsive-container {
            height: 300px;
        }
    }
    @media (max-width: 420px) {
        #jsme_canvas_test {
            transform: scale(0.7);
            transform-origin: top center;
        }
        .jsme-responsive-container {
            height: 250px;
        }
    }
</style>

<div class="col-12 col-md-10 col-lg-8 mx-auto text-center"> 
    <h3 class="h4 mt-4">Вопрос №{{ index|add:1 }}</h3> 
    <h4 class="h5 mb-4">Нарисуйте формулу для: <br><strong>«{{ molecule.name1 }}»</strong></h4> 
    
    <div class="jsme-responsive-container shadow-sm mb-4"> 
        <div id="jsme_canvas_test" style="width: 500px; height: 350px; border: 1px solid #ccc; background: white !important;"> 
        </div> 
    </div> 
    
    <!-- ИСПРАВЛЕНИЕ: Добавили id и name для самой формы, кнопки и скрытого поля, чтобы браузер не ругался -->
    <form method="POST" action="{% url 'organicnamestest_answer' index %}" id="chemistry_test_form" name="chemistry_test_form"> 
        {% csrf_token %} 
        <input type="hidden" name="user_answer" id="user_smiles" value="" autocomplete="off"> 
        <button type="submit" id="submit_answer_btn" name="submit_answer_btn" class="btn btn-primary btn-lg w-100" style="max-width: 450px">Ответить</button> 
    </form> 
</div> 

<script type="text/javascript" src="/static/jsme/jsme.nocache.js"></script> 
<script type="text/javascript"> 
    var testJsmeApplet; 
    
    function startJSME() { 
        testJsmeApplet = new JSApplet.JSME("jsme_canvas_test", "500px", "350px", {
            "options": "oldLook,paste,autocenter"
        }); 
        
        testJsmeApplet.setCallBack("AfterStructureModified", function(event) { 
            document.getElementById("user_smiles").value = event.src.smiles(); 
        }); 
    } 
    
    window.jsmeOnLoad = startJSME; 
    
    setTimeout(function() { 
        if (typeof JSApplet !== 'undefined' && !testJsmeApplet) startJSME(); 
    }, 1500); 
</script> 
{% endblock %}
