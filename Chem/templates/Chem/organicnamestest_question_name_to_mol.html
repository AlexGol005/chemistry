{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<div class="col-12 col-md-10 col-lg-8 mx-auto text-center">
    <h3 class="h4 mt-4">Вопрос №{{ index|add:1 }}</h3>
    <h4 class="h5 mb-4">Нарисуйте формулу для: <br><strong>«{{ molecule.name1 }}»</strong></h4>

    <div class="jsme-wrapper shadow-sm mx-auto mb-4" style="max-width: 500px;">
        <div id="jsme_canvas_test" 
             style="width: 100% !important; height: 350px !important; border: 1px solid #ccc; background: white !important;">
        </div>
    </div>

    <form method="POST" action="{% url 'organicnamestest_answer' index %}">
        {% csrf_token %}
        <input type="hidden" name="user_answer" id="user_smiles" value="">
        <button type="submit" class="btn btn-primary btn-lg w-100" style="max-width: 450px">Ответить</button>
    </form>
</div>

<script type="text/javascript" src="/static/jsme/jsme.nocache.js"></script>
<script type="text/javascript">
    var testJsmeApplet;
    function startJSME() {
        // Стандартные стабильные опции
        testJsmeApplet = new JSApplet.JSME("jsme_canvas_test", "100%", "350px", {
            "options": "oldLook,paste,autocenter"
        });
        
        testJsmeApplet.setCallBack("AfterStructureModified", function(event) {
            document.getElementById("user_smiles").value = event.src.smiles();
        });

        // ВКЛЮЧАЕМ НАБЛЮДАТЕЛЬ ЗА НАЖАТИЕМ НА КНОПКУ "X"
        setTimeout(enableMobileXButton, 2000); // Ждем 2 секунды, пока нарисуется панель
    }

    function enableMobileXButton() {
        // Ищем на странице картинку или элемент кнопки "X" внутри редактора JSME
        // В JSME кнопки обычно рендерятся как теги img или div с соответствующим текстом/атрибутами
        var jsmeContainer = document.getElementById("jsme_canvas_test");
        if (!jsmeContainer) return;

        // Находим все элементы и вешаем обработчик на тот, который отвечает за кнопку X
        jsmeContainer.addEventListener('click', function(e) {
            var target = e.target;
            
            // Проверяем, кликнул ли пользователь на кнопку "X" на панели (в JSME у нее специфичный вид)
            // Самый надежный способ для мобильных: если это элемент панели с текстом "X" или картинка
            if (target.tagName === 'IMG' && target.src.includes('atom_X') || target.innerText === 'X') {
                
                // Вызываем системный prompt браузера
                var userAtom = prompt("Введите обозначение атома для кнопки X (например: Cl, Br, Si):", "");
                if (userAtom) {
                    // Передаем введенный символ в кисть редактора через легальный API
                    testJsmeApplet.setAction("Atom", userAtom.trim());
                }
                
                e.stopPropagation();
                e.preventDefault();
            }
        }, true); // Используем capture mode, чтобы перехватить клик до того, как JSME его заблокирует
    }

    window.jsmeOnLoad = startJSME;
    setTimeout(function() { if (typeof JSApplet !== 'undefined' && !testJsmeApplet) startJSME(); }, 1500);
</script>



{% endblock %}
