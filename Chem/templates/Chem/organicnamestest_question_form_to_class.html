{% extends 'main/base.html' %}

{% block content %}
<div class="col-12 col-md-8 mx-auto text-center">
    <h3 class="h4">Вопрос №{{ index|add:1 }}</h3>
    <h4 class="mb-4">Определите класс вещества по формуле:</h4>
    
    <div class="display-4 border p-4 bg-light shadow-sm rounded mb-4">
        {{ molecule.formula }}
    </div>

    <form method="POST" action="{% url 'organicnamestest_answer' index %}">
        {% csrf_token %}
        
        <div class="form-group mb-4">
            <label for="class_select" class="text-muted">Выберите класс из списка:</label>
            <select name="user_answer" id="class_select" class="form-control form-control-lg custom-select">
                <option value="">--- Не выбрано ---</option>
                {% for key, value in organic_classes %}
                    <option value="{{ key }}">{{ value }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 shadow">Ответить</button>
    </form>
</div>
