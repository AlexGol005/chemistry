{% extends 'main/base.html' %}
{% load mol_extras %}

{% block content %}
<div class="col-12 col-md-8 mx-auto text-center">
    <h3 class="h4">Вопрос №{{ index|add:1 }}</h3>
    <h4 class="mb-4">Как называется это вещество?</h4>

    <div class="card p-3 mb-4 shadow-sm">
        {% render_smiles molecule.molecule width=300 height=300 %}
    </div>

    <form method="POST" action="{% url 'organicnamestest_answer' index %}">
        {% csrf_token %}
        <input type="text" name="user_answer" class="form-control form-control-lg mb-4" 
               placeholder="Введите название..." autocomplete="off">
        <button type="submit" class="btn btn-success btn-lg w-100 shadow">Ответить</button>
    </form>
</div>
{% endblock %}
